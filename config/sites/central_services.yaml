# Central Services UK -- runs on OpenCart (URLs look like
# index.php?route=product/search&search=...). This config seeds the crawl with
# the part-number-prefix searches that surface lots of spares, then follows
# each product page and reads the OpenCart "Product Code" (the part number)
# and price.
#
# NOTE: prices here are in GBP (£). The extractor detects the £ symbol
# automatically. Selectors below target OpenCart's *default* theme -- if this
# shop uses a custom theme, run:
#     python -m scraper.cli inspect "https://central-servicesuk.co.uk/index.php?route=product/search&search=133." --playwright
# and adjust the selectors to match what it prints.

name: central_services
start_urls:
  - https://central-servicesuk.co.uk/index.php?route=product/search&search=133.
  - https://central-servicesuk.co.uk/index.php?route=product/search&search=150.
  - https://central-servicesuk.co.uk/index.php?route=product/search&search=120.
  - https://central-servicesuk.co.uk/index.php?route=product/search&search=112.
allowed_domains:
  - central-servicesuk.co.uk

# This shop has bot protection that returns 503 to the simple fetcher, so we
# use a real Chrome browser. headless: false opens a visible window, which gets
# past more aggressive bot-walls (let it sit -- it solves the JS challenge).
# max_pages counts every page fetched, including the many search-listing pages
# used only for link discovery -- so set it high enough to also reach all the
# product pages behind them.
fetcher: playwright
headless: false
max_pages: 12000
delay_seconds: 0.3
respect_robots: true
# A normal browser user-agent so the bot-wall lets us through. (You buy from
# this supplier; this is just reading their public catalogue with a browser.)
user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

crawl:
  # Walk EVERY search page (1..last), not just the few the pager links to,
  # so no products in the middle pages are missed.
  auto_paginate: true
  page_param: page
  # Visit product pages as soon as they're found, before grinding through more
  # search pagination -- so real data starts landing quickly.
  priority_link_patterns:
    - "route=product/product"
  # Follow product detail pages and search pagination only.
  follow_link_patterns:
    - "route=product/product"
    - "route=product/search"
  ignore_link_patterns:
    - "route=checkout"
    - "route=account"
    - "route=product/compare"
    - "route=affiliate"
    - "add_to_cart"
    - "wishlist"
    - "&sort="
    - "&limit="

extract:
  strategy: product_page
  # Only pull data from real product pages. Search-listing pages are still
  # crawled (to find product links) but not scraped -- they list many products
  # at once and produce noisy, incomplete rows otherwise.
  only_on_url_patterns:
    - "route=product/product"
  part_number:
    # OpenCart shows the part number as "Product Code:" (a.k.a. Model).
    regex:
      - "Product Code:\\s*([A-Za-z0-9.\\-/]+)"
      - "Model:\\s*([A-Za-z0-9.\\-/]+)"
  price:
    # Default OpenCart price markup; the first match that contains a £ wins.
    selectors:
      - ".product-info .price-new"
      - ".product-info .price"
      - "ul.list-unstyled .price-new"
      - "#product .price"
      - "h2.price-new"
  description:
    # OpenCart puts the product description in the "Description" tab.
    selectors:
      - "#tab-description"
      - "#tab-description .tab-content"
      - "[itemprop=description]"
      - ".product-description"
